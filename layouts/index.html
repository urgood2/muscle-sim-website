{{ define "main" }}
<div class="container home-feed">
<h1 class="visually-hidden">{{ .Site.Params.name }}</h1>
{{ partial "game-feature.html" . }}
{{ $pager := .Paginate ((where .Site.RegularPages "Section" "post").ByDate.Reverse) 15 }}
{{ partial "feed.html" (dict "Pages" $pager.Pages "Pager" $pager) }}
{{ partial "newsletter.html" . }}
</div>
{{ end }}
