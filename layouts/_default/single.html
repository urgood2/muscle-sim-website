{{ define "main" }}
<article class="container single-post">
<h1 class="site-heading">{{ partial "page-title.html" . }}</h1>
{{ if eq .Section "post" }}<p><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>{{ end }}
<div class="post-body">{{ .Content }}</div>
{{ if and (eq .Section "post") .Params.comments }}{{ partial "disqus.html" . }}{{ end }}
</article>
{{ end }}
