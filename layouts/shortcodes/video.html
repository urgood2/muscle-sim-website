{{ $src := .Get "src" | default (.Get 0) }}
{{ if not (or (hasPrefix $src "/") (hasPrefix $src "https://")) }}{{ $src = printf "/images/%s" $src }}{{ end }}
<video controls playsinline preload="none"{{ with .Get "poster" }} poster="{{ . }}"{{ end }}{{ with .Get "alt" }} aria-label="{{ . }}"{{ end }}>
<source src="{{ $src | safeURL }}" type="video/mp4">
</video>
